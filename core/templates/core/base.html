{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Conceive Clinic{% endblock %}</title>

    <link rel="icon" type="image/png" href="{% static 'core/images/imagem-da-pagina.png' %}">
    <link rel="stylesheet" href="{% static 'core/styles/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'core/styles/dashboard_page.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="wrapper">
        <div id="content">

            <nav class="navbar">
                <div class="navbar-container">

                    <div class="navbar-logo-group">
                        <img src="{% static 'core/images/marca_conceive_horizontal.png' %}" alt="Logo Conceive" class="navbar-icon" style="height: 55px;">
                    </div>

                    <div class="navbar-center-items">
                        <div class="dropdown-pill">
                            <i class="fas fa-hospital-user"></i>
                            <span class="pill-text">{{ request.user.username }}</span>
                            <i class="fas fa-caret-down"></i>
                        </div>
                        <div class="navbar-search">
                            <input type="text" placeholder="Buscar paciente">
                        </div>
                        <div class="action-button-pill">
                            <i class="fas fa-comment-alt"></i>
                            <span>Chat</span>
                        </div>
                        <div class="action-button-pill">
                            <i class="fas fa-share-alt"></i>
                            <span>Direct Setor</span>
                        </div>
                    </div>

                    <div class="navbar-right-items">
                        <div class="dropdown-pill-user">
                            <span class="pill-text">Clínica</span>
                            <i class="fas fa-caret-down"></i>
                        </div>
                    </div>

                </div>
            </nav>

            <div class="main-content-area">
                {% block content %}{% endblock %}
            </div>

        </div>
    </div>
</body>

</html>
